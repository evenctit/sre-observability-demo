# Grafana 数据源预配置
# - Prometheus: 指标查询
# - Tempo: 链路追踪查询 (uid 固定为 tempo)
# - Loki: 日志查询 (uid 固定为 loki)
# - PostgreSQL: tushare 股票数据查询 (daily 日线等, 宿主机数据库)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |-
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
      - name: Pyroscope
        uid: pyroscope
        # 注意: Grafana 12.2 的 pyroscope 数据源为 core 插件, 但插件 id 是完整名
        # grafana-pyroscope-datasource, 不再接受短名 pyroscope (短名会报
        # Could not find plugin definition for data source)
        type: grafana-pyroscope-datasource
        access: proxy
        url: http://pyroscope.monitoring.svc.cluster.local:4040
      - name: PostgreSQL
        uid: postgres
        type: postgres
        access: proxy
        url: 192.168.31.215:5432
        user: postgres
        # 注意: provisioning 模式下默认数据库必须写在 jsonData.database,
        # 顶层 database 字段不被识别 (会导致前端报 "no default database" 无法查询)
        jsonData:
          sslmode: disable
          postgresVersion: 1500
          database: postgres
        secureJsonData:
          password: westlife
