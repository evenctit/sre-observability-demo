# Grafana Dashboard as Code (provisioning)
# - dashboards.yaml: dashboard provider 配置, 指向 /var/lib/grafana/dashboards
# - demo-api-logs.json: "Demo API 日志" dashboard (Logs 面板 + 日志量趋势面板)
# 数据源使用 Loki (uid=loki), 查询 OTLP 原生摄入生成的 service_name 标签
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  dashboards.yaml: |-
    apiVersion: 1
    providers:
      - name: sre-demo
        folder: SRE Demo
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
  demo-api-health.json: |-
    {
      "uid": "demo-api-health",
      "title": "Demo API 健康状态",
      "description": "通过 Prometheus Blackbox Exporter 探测 demo-api /healthz 接口的健康状态",
      "tags": ["demo-api", "health", "blackbox"],
      "timezone": "browser",
      "editable": true,
      "refresh": "10s",
      "schemaVersion": 39,
      "version": 1,
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "服务状态 (probe_success)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 12, "x": 0, "y": 0 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": { "text": "UP 正常", "color": "green", "index": 0 },
                    "0": { "text": "DOWN 异常", "color": "red", "index": 1 }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "probe_success{job=\"blackbox-demo-api\"}",
              "instant": true
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "近5分钟探测失败次数",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 12, "x": 12, "y": 0 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "count_over_time(probe_success{job=\"blackbox-demo-api\"}[5m]) - sum_over_time(probe_success{job=\"blackbox-demo-api\"}[5m])",
              "instant": true
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "探测耗时 (probe_duration_seconds)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "lineWidth": 1, "fillOpacity": 20, "showPoints": "never" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "probe_duration_seconds{job=\"blackbox-demo-api\"}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "HTTP 状态码 (probe_http_status_code)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 4 },
          "fieldConfig": {
            "defaults": {
              "custom": { "lineWidth": 1, "fillOpacity": 20, "showPoints": "never" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "probe_http_status_code{job=\"blackbox-demo-api\"}"
            }
          ]
        }
      ]
    }
  # demo-api-profiling: profiling dashboard (数据源 Pyroscope)
  # 注意: Grafana 12.2 内置 pyroscope 数据源 (v5) 的 ds/query 只支持 queryType=profile,
  # 返回火焰图帧 (level/value/self/label); 旧的 queryType=flamegraph 返回空帧,
  # 时间序列 (SelectSeries) 亦不可用, 故第二个面板用 table 展示函数级 CPU 开销
  demo-api-profiling.json: |-
    {
      "uid": "demo-api-profiling",
      "title": "Demo API Profiling",
      "description": "通过 Pyroscope SDK 采集的 demo-api 持续 CPU profiling (FlameGraph 与函数级 CPU 开销)",
      "tags": ["demo-api", "profiling", "pyroscope"],
      "timezone": "browser",
      "editable": true,
      "refresh": "30s",
      "schemaVersion": 39,
      "version": 2,
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "flamegraph",
          "title": "CPU FlameGraph (service_name=demo-api)",
          "datasource": { "type": "grafana-pyroscope-datasource", "uid": "pyroscope" },
          "gridPos": { "h": 16, "w": 24, "x": 0, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "queryType": "profile",
              "profileTypeId": "process_cpu:cpu:nanoseconds:cpu:nanoseconds",
              "labelSelector": "{service_name=\"demo-api\"}",
              "groupBy": []
            }
          ]
        },
        {
          "id": 2,
          "type": "table",
          "title": "函数级 CPU 开销明细 (process_cpu)",
          "datasource": { "type": "grafana-pyroscope-datasource", "uid": "pyroscope" },
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 16 },
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "auto", "filterable": true },
              "overrides": [
                {
                  "matcher": { "id": "byName", "options": "label" },
                  "properties": [
                    { "id": "displayName", "value": "调用栈函数" }
                  ]
                },
                {
                  "matcher": { "id": "byName", "options": "self" },
                  "properties": [
                    { "id": "displayName", "value": "自身 CPU" },
                    { "id": "unit", "value": "ns" },
                    { "id": "custom.width", "value": 160 }
                  ]
                },
                {
                  "matcher": { "id": "byName", "options": "value" },
                  "properties": [
                    { "id": "displayName", "value": "累计 CPU" },
                    { "id": "unit", "value": "ns" },
                    { "id": "custom.width", "value": 160 }
                  ]
                },
                {
                  "matcher": { "id": "byName", "options": "level" },
                  "properties": [
                    { "id": "displayName", "value": "层级" },
                    { "id": "custom.width", "value": 100 }
                  ]
                }
              ]
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "profile",
              "profileTypeId": "process_cpu:cpu:nanoseconds:cpu:nanoseconds",
              "labelSelector": "{service_name=\"demo-api\"}",
              "groupBy": []
            }
          ]
        }
      ]
    }
  demo-api-logs.json: |-
    {
      "uid": "demo-api-logs",
      "title": "Demo API 日志",
      "description": "通过 OpenTelemetry Collector 采集、Loki 存储的 demo-api 应用日志",
      "tags": ["demo-api", "logs", "loki"],
      "timezone": "browser",
      "editable": true,
      "refresh": "10s",
      "schemaVersion": 39,
      "version": 1,
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": { "type": "loki", "uid": "loki" },
            "query": { "label": "k8s_pod_name", "stream": "", "refId": "var" },
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "current": { "selected": true, "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "logs",
          "title": "demo-api 应用日志 (service_name=demo-api)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 16, "w": 24, "x": 0, "y": 0 },
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{service_name=\"demo-api\", k8s_pod_name=~\"$pod\"}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "每分钟日志行数",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "fieldConfig": {
            "defaults": {
              "custom": { "lineWidth": 1, "fillOpacity": 20, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum by (detected_level) (count_over_time({service_name=\"demo-api\"}[1m]))",
              "legendFormat": "{{detected_level}}"
            }
          ]
        }
      ]
    }
