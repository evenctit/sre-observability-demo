# Grafana Dashboard as Code (provisioning)
# - dashboards.yaml: dashboard provider 配置, 指向 /var/lib/grafana/dashboards
# - demo-api-logs.json: "Demo API 日志" dashboard (Logs 面板 + 日志量趋势面板)
# 数据源使用 Loki (uid=loki), 查询 OTLP 原生摄入生成的 service_name 标签
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  dashboards.yaml: |-
    apiVersion: 1
    providers:
      - name: sre-demo
        folder: SRE Demo
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
  demo-api-health.json: |-
    {
      "uid": "demo-api-health",
      "title": "服务健康状态总览 (Blackbox)",
      "description": "通过 Prometheus Blackbox Exporter 探测各服务 /healthz 的健康状态 (demo-api / tushare-service, 新增服务自动纳入总览)",
      "tags": ["health", "blackbox", "multi-service"],
      "timezone": "browser",
      "editable": true,
      "refresh": "10s",
      "schemaVersion": 39,
      "version": 2,
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "instance",
            "label": "服务地址",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": { "query": "label_values(probe_success{job=~\"blackbox-.*\"}, instance)", "refId": "var" },
            "refresh": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": { "selected": true, "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "可用服务数 (probe_success=1)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "count(probe_success{job=~\"blackbox-.*\"} == 1) OR vector(0)",
              "instant": true
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "异常服务数 (probe_success=0)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "count(probe_success{job=~\"blackbox-.*\"} == 0) OR vector(0)",
              "instant": true
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "平均探测耗时",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "avg(probe_duration_seconds{job=~\"blackbox-.*\"})",
              "instant": true
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "近5分钟探测失败次数",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(count_over_time(probe_success{job=~\"blackbox-.*\"}[5m])) - sum(sum_over_time(probe_success{job=~\"blackbox-.*\"}[5m])) OR vector(0)",
              "instant": true
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "服务状态墙 (每个服务一个状态块, 新增服务自动出现)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 4 },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": true },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": { "text": "UP 正常", "color": "green", "index": 0 },
                    "0": { "text": "DOWN 异常", "color": "red", "index": 1 }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "probe_success{job=~\"blackbox-.*\"}",
              "instant": true
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "探测耗时与状态码 ($instance)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "repeat": "instance",
          "repeatDirection": "h",
          "fieldConfig": {
            "defaults": {
              "custom": { "lineWidth": 1, "fillOpacity": 20, "showPoints": "never" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": [
              {
                "matcher": { "id": "byFrameRefID", "options": "B" },
                "properties": [
                  { "id": "unit", "value": "short" },
                  { "id": "custom.axisPlacement", "value": "right" }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "probe_duration_seconds{job=~\"blackbox-.*\", instance=~\"$instance\"}",
              "legendFormat": "探测耗时"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "probe_http_status_code{job=~\"blackbox-.*\", instance=~\"$instance\"}",
              "legendFormat": "HTTP状态码"
            }
          ]
        }
      ]
    }
  # demo-api-profiling: profiling dashboard (数据源 Pyroscope)
  # 注意: Grafana 12.2 内置 pyroscope 数据源 (v5) 的 ds/query 只支持 queryType=profile,
  # 返回火焰图帧 (level/value/self/label); 旧的 queryType=flamegraph 返回空帧,
  # 时间序列 (SelectSeries) 亦不可用, 故第二个面板用 table 展示函数级 CPU 开销
  demo-api-profiling.json: |-
    {
      "uid": "demo-api-profiling",
      "title": "Demo API Profiling",
      "description": "通过 Pyroscope SDK 采集的 demo-api 持续 CPU profiling (FlameGraph 与函数级 CPU 开销)",
      "tags": ["demo-api", "profiling", "pyroscope"],
      "timezone": "browser",
      "editable": true,
      "refresh": "30s",
      "schemaVersion": 39,
      "version": 2,
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "flamegraph",
          "title": "CPU FlameGraph (service_name=demo-api)",
          "datasource": { "type": "grafana-pyroscope-datasource", "uid": "pyroscope" },
          "gridPos": { "h": 16, "w": 24, "x": 0, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "queryType": "profile",
              "profileTypeId": "process_cpu:cpu:nanoseconds:cpu:nanoseconds",
              "labelSelector": "{service_name=\"demo-api\"}",
              "groupBy": []
            }
          ]
        },
        {
          "id": 2,
          "type": "table",
          "title": "函数级 CPU 开销明细 (process_cpu)",
          "datasource": { "type": "grafana-pyroscope-datasource", "uid": "pyroscope" },
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 16 },
          "fieldConfig": {
            "defaults": {
              "custom": { "align": "auto", "filterable": true },
              "overrides": [
                {
                  "matcher": { "id": "byName", "options": "label" },
                  "properties": [
                    { "id": "displayName", "value": "调用栈函数" }
                  ]
                },
                {
                  "matcher": { "id": "byName", "options": "self" },
                  "properties": [
                    { "id": "displayName", "value": "自身 CPU" },
                    { "id": "unit", "value": "ns" },
                    { "id": "custom.width", "value": 160 }
                  ]
                },
                {
                  "matcher": { "id": "byName", "options": "value" },
                  "properties": [
                    { "id": "displayName", "value": "累计 CPU" },
                    { "id": "unit", "value": "ns" },
                    { "id": "custom.width", "value": 160 }
                  ]
                },
                {
                  "matcher": { "id": "byName", "options": "level" },
                  "properties": [
                    { "id": "displayName", "value": "层级" },
                    { "id": "custom.width", "value": 100 }
                  ]
                }
              ]
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "queryType": "profile",
              "profileTypeId": "process_cpu:cpu:nanoseconds:cpu:nanoseconds",
              "labelSelector": "{service_name=\"demo-api\"}",
              "groupBy": []
            }
          ]
        }
      ]
    }
  demo-api-logs.json: |-
    {
      "uid": "demo-api-logs",
      "title": "服务日志总览 (Loki)",
      "description": "通过 OpenTelemetry Collector 采集整个集群所有服务的容器日志 (应用 + 系统组件), Loki 存储, 按 service_name 动态筛选, 新增服务自动纳入",
      "tags": ["logs", "loki", "multi-service"],
      "timezone": "browser",
      "editable": true,
      "refresh": "10s",
      "schemaVersion": 39,
      "version": 2,
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service_name",
            "label": "服务",
            "type": "query",
            "datasource": { "type": "loki", "uid": "loki" },
            "query": { "label": "service_name", "stream": "{service_name=~\".+\"}", "refId": "var" },
            "refresh": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": { "selected": true, "text": "All", "value": "$__all" }
          },
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": { "type": "loki", "uid": "loki" },
            "query": { "label": "k8s_pod_name", "stream": "{service_name=~\"$service_name\"}", "refId": "var" },
            "refresh": 1,
            "includeAll": true,
            "allValue": ".+",
            "current": { "selected": true, "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "各服务日志量对比 (每分钟, 按服务分组)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "custom": { "lineWidth": 1, "fillOpacity": 20, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum by (service_name) (count_over_time({service_name=~\"$service_name\"}[1m]))",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "每分钟日志行数 (按级别)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "custom": { "lineWidth": 1, "fillOpacity": 20, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum by (detected_level) (count_over_time({service_name=~\"$service_name\"}[1m]))",
              "legendFormat": "{{detected_level}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "logs",
          "title": "全集群服务日志 (service_name / Pod 可筛选)",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 18, "w": 24, "x": 0, "y": 8 },
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{service_name=~\"$service_name\", k8s_pod_name=~\"$pod\"}"
            }
          ]
        }
      ]
    }
  # 股票日线趋势 dashboard: PostgreSQL 数据源查询 tushare.daily 表
  # (batch job 定时拉取入库), 多股票变量筛选, 收盘价/成交量趋势 + 最新行情总览
  tushare-daily.json: |-
    {
      "uid": "tushare-daily",
      "title": "股票日线趋势 (Tushare)",
      "description": "基于 PostgreSQL tushare.daily 表展示股票日线行情趋势 (收盘价/成交量/最新行情), 支持多股票筛选",
      "tags": ["tushare", "stock", "postgres"],
      "timezone": "browser",
      "editable": true,
      "refresh": "",
      "schemaVersion": 39,
      "version": 1,
      "time": { "from": "now-90d", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "ts_code",
            "label": "股票",
            "type": "query",
            "datasource": { "type": "grafana-postgresql-datasource", "uid": "postgres" },
            "definition": "SELECT DISTINCT ts_code FROM tushare.daily ORDER BY ts_code",
            "query": "SELECT DISTINCT ts_code FROM tushare.daily ORDER BY ts_code",
            "refresh": 1,
            "multi": true,
            "includeAll": true,
            "current": { "selected": true, "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "收盘价趋势",
          "datasource": { "type": "grafana-postgresql-datasource", "uid": "postgres" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyCNY",
              "custom": { "lineWidth": 1, "fillOpacity": 10, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "grafana-postgresql-datasource", "uid": "postgres" },
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT time, metric, value FROM (SELECT to_timestamp(trade_date, 'YYYYMMDD') AS time, ts_code AS metric, close AS value FROM tushare.daily WHERE ts_code IN ($ts_code)) s WHERE $__timeFilter(time) ORDER BY time"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "成交量趋势 (手)",
          "datasource": { "type": "grafana-postgresql-datasource", "uid": "postgres" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "lineWidth": 1, "fillOpacity": 30, "showPoints": "never" }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "grafana-postgresql-datasource", "uid": "postgres" },
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "SELECT time, metric, value FROM (SELECT to_timestamp(trade_date, 'YYYYMMDD') AS time, ts_code AS metric, vol::double precision AS value FROM tushare.daily WHERE ts_code IN ($ts_code)) s WHERE $__timeFilter(time) ORDER BY time"
            }
          ]
        },
        {
          "id": 3,
          "type": "table",
          "title": "最新交易日行情总览",
          "datasource": { "type": "grafana-postgresql-datasource", "uid": "postgres" },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 9 },
          "options": {
            "showHeader": true
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "pct_chg" },
                "properties": [
                  { "id": "unit", "value": "percent" },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "red", "value": 0 }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "grafana-postgresql-datasource", "uid": "postgres" },
              "format": "table",
              "rawQuery": true,
              "rawSql": "SELECT ts_code, trade_date, open, high, low, close, pre_close, change, pct_chg, vol, amount FROM tushare.daily WHERE ts_code IN ($ts_code) AND trade_date = (SELECT max(trade_date) FROM tushare.daily) ORDER BY ts_code"
            }
          ]
        }
      ]
    }
