# Grafana 部署 (管理员账号 admin/admin, 通过 NodePort 30300 访问)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      initContainers:
        # 修复 PVC 目录属主, 使 grafana(472) 可写
        - name: fix-perm
          image: docker.m.daocloud.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown -R 472:472 /var/lib/grafana || true"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
      containers:
        - name: grafana
          image: docker.m.daocloud.io/grafana/grafana:12.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            # ---------- SMTP 邮件告警配置 (新浪邮箱) ----------
            # 发件账号与授权码为占位符, 替换后重启 Grafana 即可正常发信
            - name: GF_SMTP_ENABLED
              value: "true"
            - name: GF_SMTP_HOST
              value: smtp.sina.com:465
            - name: GF_SMTP_USER
              value: REPLACE-WITH-SENDER@sina.com
            - name: GF_SMTP_PASSWORD
              value: REPLACE-WITH-SMTP-AUTH-CODE
            - name: GF_SMTP_FROM_ADDRESS
              value: REPLACE-WITH-SENDER@sina.com
            - name: GF_SMTP_FROM_NAME
              value: SRE Observability Demo
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            # dashboard provider 配置 (provisioning 自动加载)
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            # dashboard JSON 文件目录
            - name: dashboards-json
              mountPath: /var/lib/grafana/dashboards
            # 告警配置 (contactPoint / 策略 / 告警规则)
            - name: alerting
              mountPath: /etc/grafana/provisioning/alerting
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        # 与 dashboards-json 同一个 ConfigMap, 通过 items 拆分挂载到不同目录
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: dashboards-json
          configMap:
            name: grafana-dashboards
            items:
              - key: demo-api-logs.json
                path: demo-api-logs.json
              - key: demo-api-health.json
                path: demo-api-health.json
        # 告警配置文件 (grafana/alerting.yaml)
        - name: alerting
          configMap:
            name: grafana-alerting
