# Loki 部署 (单二进制模式)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      initContainers:
        # 修复 PVC 目录属主, 使 loki(10001) 可写
        - name: fix-perm
          image: docker.m.daocloud.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown -R 10001:10001 /var/loki || true"]
          volumeMounts:
            - name: data
              mountPath: /var/loki
      containers:
        - name: loki
          image: docker.m.daocloud.io/grafana/loki:3.4.2
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - containerPort: 3100
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /var/loki
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
