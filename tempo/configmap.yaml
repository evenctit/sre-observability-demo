# Tempo 链路追踪后端配置
# - 3200: HTTP 查询 API (Grafana 数据源使用)
# - 4317/4318: OTLP gRPC/HTTP 接收端口 (OpenTelemetry SDK 上报使用)
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: monitoring
data:
  tempo.yaml: |-
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
