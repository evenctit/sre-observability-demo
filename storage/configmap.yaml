# local-path 存储供应器配置
# 注意: setup/teardown 脚本使用 VOL_DIR 变量(v0.0.31 由 provisioner 注入)
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: monitoring
data:
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/var/local-path-provisioner"]
        }
      ]
    }
  setup: |-
    #!/bin/sh
    if [ ! -d "$VOL_DIR" ]; then
      mkdir -m 0777 -p "$VOL_DIR"
    fi
  teardown: |-
    #!/bin/sh
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
        - name: helper-pod
          image: docker.m.daocloud.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
