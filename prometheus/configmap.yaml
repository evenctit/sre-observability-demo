# Prometheus 抓取配置
# - prometheus 自身指标
# - kubelet cAdvisor 容器指标 (通过 apiserver proxy + ServiceAccount token)
# - 带有 prometheus.io/scrape: "true" 注解的 Pod 自动发现
# - sre-observability-ui HTTP 指标 (宿主机 192.168.31.112:3000, 请求计数/成功率/P95 延时)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |-
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      - job_name: kubernetes-nodes-cadvisor
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc.cluster.local:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
      # Blackbox HTTP 探测: 检测 demo-api 健康检查接口
      # 指标: probe_success (1=健康, 0=异常), probe_duration_seconds, probe_http_status_code
      - job_name: blackbox-demo-api
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - http://demo-api.demo.svc.cluster.local/healthz
        relabel_configs:
          # 探测目标地址注入 ?target= 参数
          - source_labels: [__address__]
            target_label: __param_target
          # 保留目标地址为 instance 标签, 便于展示
          - source_labels: [__param_target]
            target_label: instance
          # 实际抓取地址改为 blackbox-exporter
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc.cluster.local:9115
      # Blackbox HTTP 探测: 检测 tushare-service 健康检查接口
      # 新增服务监控时按此模板追加 job 即可; dashboard 按 job=~"blackbox-.*" 自动纳入所有探测目标
      - job_name: blackbox-tushare-service
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - http://tushare-service.default.svc.cluster.local:5000/healthz
        relabel_configs:
          # 探测目标地址注入 ?target= 参数
          - source_labels: [__address__]
            target_label: __param_target
          # 保留目标地址为 instance 标签, 便于展示
          - source_labels: [__param_target]
            target_label: instance
          # 实际抓取地址改为 blackbox-exporter
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc.cluster.local:9115
      # SRE 可观测性 UI (Node.js 架构展示服务, 运行在宿主机 192.168.31.112:3000)
      # 指标: http_requests_total (每分钟请求数/请求成功率), http_request_duration_seconds (P95 请求延时)
      # P95 延时查询: histogram_quantile(0.95, sum by (le, route) (rate(http_request_duration_seconds_bucket[5m])))
      - job_name: sre-observability-ui
        static_configs:
          - targets: ['192.168.31.112:3000']
